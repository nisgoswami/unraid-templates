name: Track official Bifrost image
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: track-bifrost-upstream
  cancel-in-progress: false
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check official Docker image
        run: python3 scripts/track-upstream.py
      - name: Publish updated template metadata
        run: |
          git add templates/bifrost-ai-gateway.xml upstream-image.json
          if git diff --cached --quiet; then
            echo 'No new upstream image.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Track newly published official Bifrost image'
          git push
